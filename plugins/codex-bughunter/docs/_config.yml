# Optional static-docs config for the Codex BugHunter fork.
# Built from the /docs folder. Uses just-the-docs for built-in search.
title: Codex BugHunter
description: >-
  A Codex plugin for authorized bug-hunting and red-team workflows.
remote_theme: just-the-docs/just-the-docs

url: "https://git.ot9.me"
baseurl: "/Adminx/codex-bughunter"

# Search (just-the-docs built-in)
search_enabled: true
search:
  heading_level: 2
  previews: 3

# Repo links in the nav footer
aux_links:
  "Repository":
    - "https://git.ot9.me/Adminx/codex-bughunter"
  "Sponsor — Atlas Cloud":
    - "https://www.atlascloud.ai/console/coding-plan"
aux_links_new_tab: true

color_scheme: dark
heading_anchors: true

# Don't try to render engineering/meta files as site pages.
exclude:
  - disclosed-reports/
  - verification/
  - automation/
  - "*.py"
  - ".DS_Store"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
