[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-bughunter"
version = "2.1.1"
description = "cbh — terminal-native companion for the Codex BugHunter plugin"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT AND CC-BY-4.0" }
authors = [{ name = "Sachin Sharma" }]
keywords = ["security", "bug-bounty", "recon", "codex", "pentest"]
dependencies = []

[project.optional-dependencies]
# `requests` is optional — cbh falls back to urllib when it's absent.
http = ["requests"]

[project.urls]
Homepage = "https://git.ot9.me/Adminx/codex-bughunter"
Documentation = "https://git.ot9.me/Adminx/codex-bughunter/src/branch/main/plugins/codex-bughunter/docs/cbh-cli.md"

[project.scripts]
cbh = "cbh.cli:main"

[tool.setuptools]
packages = ["cbh", "engine"]
include-package-data = false

[tool.setuptools.package-data]
cbh = ["data/*.json"]
engine = ["schemas/*.json"]

[tool.setuptools.exclude-package-data]
cbh = ["*.pyc", "__pycache__/*"]
engine = ["*.pyc", "__pycache__/*"]
